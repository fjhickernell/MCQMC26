project:
  type: default
  output-dir: _site
  render:
    - "*.qmd"

  pre-render:
    - python ../scripts/refresh_slide_artifacts.py
    - python ../scripts/collect_main_messages.py

  resources:
    - ../assets/**
    - ../notebooks/MCQMC26_figures
    - ../classlib/classlib/quarto/assets/images/campus/IllinoisTech_MiesCampus_slide.jpg
    - ../classlib/**/*

execute:
  kernel: qmcpy
  warning: false
  message: false